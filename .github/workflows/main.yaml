# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python
---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

env:
  FORCE_COLOR: "1" # Make tools pretty.

#permissions: {}

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:

      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v6.4.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # https://github.com/actions/setup-python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Install project
        run: uv sync --dev

      - name: Run test suite
        run: just test

  biomni-extra:
    name: Biomni extra (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6.4.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # Deliberately omit the dev group. It contains pandas through validation
      # tooling and would hide an under-declared end-user Biomni extra.
      - name: Install clean Biomni extra
        run: uv sync --no-dev --extra biomni

      - name: Verify real A1 import, signature, and construction
        env:
          # Base jobs skip these tests; this job exists to prove the extra is
          # complete, so a missing runtime must fail rather than skip.
          REQUIRE_BIOMNI_RUNTIME: "1"
        run: |
          uv run --no-dev --extra biomni --with pytest --with pytest-asyncio \
            pytest -q -rs \
            tests/test_biomni_provider.py::test_build_agent_kwargs_accepted_by_a1_signature \
            tests/test_biomni_provider.py::test_build_agent_constructs_with_clean_extra
