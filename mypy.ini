[mypy]

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-typer.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-aiofiles.*]
ignore_missing_imports = True

[mypy-linkml_reference_validator.*]
ignore_missing_imports = True

# Both modules below are generated by linkml's gen-pydantic (see `just
# gen-datamodel`) and are not hand-edited, so their type-safety is upstream's
# concern rather than something to patch here.
[mypy-deep_research_client.validation.datamodel]
ignore_errors = True

[mypy-deep_research_client.datamodel.*]
ignore_errors = True

