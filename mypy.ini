[mypy]

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-typer.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-aiofiles.*]
ignore_missing_imports = True

[mypy-linkml_reference_validator.*]
ignore_missing_imports = True

[mypy-linkml_term_validator.*]
ignore_missing_imports = True

[mypy-prefixmaps.*]
ignore_missing_imports = True

# Every module below is generated by linkml's gen-pydantic (see `just
# gen-datamodel`) and is not hand-edited, so its type-safety is upstream's
# concern rather than something to patch here.
[mypy-deep_research_client.validation.datamodel]
ignore_errors = True

# Likewise generated, from term_validation.yaml.
[mypy-deep_research_client.validation.term_datamodel]
ignore_errors = True

# Likewise generated, from the capability/resource/archetype schema.
[mypy-deep_research_client.datamodel.deep_research_client_pydantic]
ignore_errors = True

