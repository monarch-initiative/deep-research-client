[mypy]

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-typer.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-aiofiles.*]
ignore_missing_imports = True

[mypy-linkml_reference_validator.*]
ignore_missing_imports = True

[mypy-linkml_term_validator.*]
ignore_missing_imports = True

[mypy-prefixmaps.*]
ignore_missing_imports = True

# Generated by linkml's gen-pydantic from reference_validation.yaml; not hand-edited,
# so its type-safety is upstream's concern rather than something to patch here.
[mypy-deep_research_client.validation.datamodel]
ignore_errors = True

# Likewise generated, from term_validation.yaml.
[mypy-deep_research_client.validation.term_datamodel]
ignore_errors = True

