id: https://w3id.org/monarch-initiative/deep-research-client/alignment
name: alignment
title: Deep Research Client Claim Alignment
description: >-
  Data model for aligning the claims of one source against another (issue #43,
  item 2). Given two ClaimSets A and B (see claims.yaml), alignment pairs claims
  that are about the same thing and classifies each pair on two orthogonal axes:

  - semantic_relation: how the two propositions relate (identical, one subsumes
    the other, close, consistent, complementary, contradictory, unrelated). This
    is judged by a model from the claim texts.
  - evidential_relation: how the two claims' evidential standing relates, derived
    from each claim's `about` and `basis` in claims.yaml. It records, for example,
    that the same conclusion is a firsthand observation in one source and
    background knowledge in the other. This is computed, not judged.

  A pair also records whether the two claims share a citation (independent
  corroboration versus the same source echoed), and which signal proposed the
  pair. Claims with no aligned partner are not a relation; they are surfaced as
  coverage on the container (see alignment_models.ClaimAlignment).

  Report-level rubric summaries (issue #43, item 4) aggregate these pair
  relations into auditable, count-based metrics. Nothing here forces one scoring
  schema: a RubricSummary is a list of named RubricMetrics, each carrying the
  counts and the pair or claim ids that produced it, so a downstream project can
  read, recompute or extend it.

  This schema is standalone: it imports only linkml:types and redeclares a
  lightweight AlignedSource rather than importing claims.yaml, so each datamodel
  generates independently (as claims.yaml and evaluation.yaml already do) and the
  drift test stays a single-file regenerate-and-diff.

  This schema is the source of truth for
  deep_research_client/claims/alignment_datamodel.py, generated with
  `just gen-datamodel`. Derived views and the computed axes are added in
  deep_research_client/claims/alignment_models.py; they are not stored here.

license: BSD-3-Clause

prefixes:
  linkml: https://w3id.org/linkml/
  alignment: https://w3id.org/monarch-initiative/deep-research-client/alignment/
  dcterms: http://purl.org/dc/terms/

default_prefix: alignment
default_range: string

imports:
  - linkml:types

enums:

  AlignedSourceType:
    description: >-
      What kind of document a set of claims came from. Mirrors claims.SourceType;
      redeclared here to keep this schema standalone.
    permissible_values:
      MARKDOWN_REPORT:
        description: A deep research report or other markdown prose.
      STRUCTURED_DOCUMENT:
        description: A YAML or JSON knowledge artifact.

  SemanticRelation:
    description: >-
      How claim A's proposition relates to claim B's, read from A to B. The
      relation is the model's judgement of the two claim texts; it is not a check
      of whether either claim is true. Only SUBSUMES and SUBSUMED_BY are
      direction-sensitive; the rest are symmetric.
    permissible_values:
      IDENTICAL:
        description: >-
          The two claims assert the same thing. They may be worded differently,
          but neither adds or restricts anything relative to the other.
      SUBSUMES:
        description: >-
          A is the more general claim and B is a special case of it: everything B
          asserts, A asserts too, and A says more or applies more broadly.
      SUBSUMED_BY:
        description: >-
          A is the more specific claim: A is a special case of B. The mirror of
          SUBSUMES.
      CLOSE:
        description: >-
          The two claims are about the same underlying fact but differ in wording,
          precision or scope in a way that is neither identity nor a clean
          subsumption (for example a different reported percentage for the same
          relationship, or overlapping but not nested populations).
      CONSISTENT:
        description: >-
          The two claims make different assertions that can both hold at once.
          They are logically compatible but do not state the same fact.
      COMPLEMENTARY:
        description: >-
          A kind of CONSISTENT: the two claims are about the same subject and each
          supplies something the other does not, so together they are more
          informative than either alone.
      CONTRADICTORY:
        description: >-
          The two claims cannot both be true: one asserts what the other denies,
          or they give incompatible values for the same relationship.
      UNRELATED:
        description: >-
          The two claims are about different subject matter, with no meaningful
          relation to classify. A pair that reaches the model but is unrelated is
          recorded so the judgement is explicit.

  EvidentialRelation:
    description: >-
      How the two claims' evidential standing relates, read from A to B and
      derived from each claim's `about` and `basis` (see claims.yaml). This says
      nothing about whether the claims agree; a pair can be IDENTICAL on the
      semantic axis while one side is a firsthand observation and the other is
      stated as background knowledge.
    permissible_values:
      BOTH_OBSERVATION:
        description: Both claims are presented as their source's own finding.
      BOTH_SECONDARY:
        description: Both claims attribute the assertion to another work.
      BOTH_BACKGROUND:
        description: Both claims state the assertion as background knowledge, uncited.
      A_OBSERVATION_B_SECONDARY:
        description: A is a firsthand observation; B attributes it to another work.
      A_SECONDARY_B_OBSERVATION:
        description: A attributes it to another work; B is a firsthand observation.
      A_OBSERVATION_B_BACKGROUND:
        description: A is a firsthand observation; B states it as background knowledge.
      A_BACKGROUND_B_OBSERVATION:
        description: A states it as background knowledge; B is a firsthand observation.
      A_SECONDARY_B_BACKGROUND:
        description: A attributes it to another work; B states it as background knowledge.
      A_BACKGROUND_B_SECONDARY:
        description: A states it as background knowledge; B attributes it to another work.
      NOT_APPLICABLE:
        description: >-
          At least one claim is about a work rather than the domain (claims.about
          is WORK), so the observation/attribution/background distinction does not
          apply.
      UNDETERMINED:
        description: >-
          At least one domain claim carries no basis, so the relation cannot be
          computed.

  CandidateSignal:
    description: Why a pair was proposed for classification.
    permissible_values:
      ENTITY:
        description: The two claims share a grounded entity (the same CURIE).
      CITATION:
        description: The two claims share a citation that resolves to the same reference_id.
      LEXICAL:
        description: >-
          The two claims' content words overlap at or above the configured
          threshold (Jaccard over singularised, stop-word-filtered terms).
      EMBEDDING:
        description: >-
          A caller-supplied embedder scored the two claim texts as similar. Only
          present when an embedder was provided.

classes:

  ClaimAlignment:
    description: >-
      The alignment of one source's claims (A) against another's (B): the pairs
      found and classified, with enough provenance to reproduce or audit them.
    tree_root: true
    attributes:
      source_a:
        range: AlignedSource
        required: true
        inlined: true
        description: The first source, whose claims fill the A side of every pair.
      source_b:
        range: AlignedSource
        required: true
        inlined: true
        description: The second source, whose claims fill the B side of every pair.
      aligner:
        range: AlignerInfo
        required: true
        inlined: true
      pairs:
        range: AlignedClaimPair
        multivalued: true
        inlined_as_list: true
        description: >-
          One per classified candidate pair, including pairs judged UNRELATED.
          A claim may appear in several pairs, or in none.

  AlignedSource:
    description: >-
      A source whose claims were aligned, identified as its ClaimSet.source was.
      A lightweight copy of claims.SourceDocument, carried so an alignment file is
      auditable on its own.
    attributes:
      id:
        description: The source's id, as recorded on its ClaimSet (a path or URI).
        required: true
      source_type:
        range: AlignedSourceType
        required: true
      title:
        slot_uri: dcterms:title
        description: The source's title, when it has one.
      content_sha256:
        description: >-
          SHA-256 of the exact source text, copied from the ClaimSet, so spans in
          the aligned claims can still be checked against the source file.

  AlignerInfo:
    description: What produced an alignment, so it can be reproduced or compared.
    attributes:
      name:
        description: Aligner identifier, for example llm-pairwise.
        required: true
      model:
        description: >-
          Model used to classify the semantic relation: the id the model's
          replies report, as ExtractorInfo records it.
      prompt_version:
        description: Version of the classification prompt.
      min_overlap:
        range: float
        description: >-
          The lexical overlap threshold used for candidate generation (Jaccard,
          0 to 1).
      embedder_used:
        range: boolean
        description: Whether a caller-supplied embedder augmented candidate generation.

  AlignedClaimPair:
    description: >-
      One claim from source A paired with one from source B, classified on the
      semantic and evidential axes.
    attributes:
      id:
        description: Identifier, unique within the alignment.
        required: true
        identifier: true
      claim_a_id:
        description: The id of the A-side claim, within source A's ClaimSet.
        required: true
      claim_b_id:
        description: The id of the B-side claim, within source B's ClaimSet.
        required: true
      claim_a_text:
        description: >-
          The A-side claim's text, copied here so the pair reads on its own. The
          claim itself, with its provenance, is in source A's ClaimSet.
        required: true
      claim_b_text:
        description: The B-side claim's text, copied here for the same reason.
        required: true
      semantic_relation:
        range: SemanticRelation
        required: true
      evidential_relation:
        range: EvidentialRelation
        required: true
      shares_citation:
        range: boolean
        description: >-
          True when both claims carry a citation resolving to the same
          reference_id: the same work is cited on both sides, so agreement between
          them is not independent corroboration.
      candidate_signals:
        range: CandidateSignal
        multivalued: true
        inlined_as_list: true
        description: Which signals proposed this pair for classification.
      confidence:
        range: float
        description: The model's confidence in the semantic relation, 0 to 1, when it gave one.
      rationale:
        description: One sentence from the model justifying the semantic relation.

  RubricSummary:
    description: >-
      A report-level summary of an alignment (issue #43, item 4): named metrics
      aggregated from the pair relations. Not a fixed schema: a downstream project
      may read these metrics, recompute them, or add its own.
    attributes:
      reference:
        description: >-
          Which source the summary treats as the reference the other is judged
          against: "a" or "b". Completeness, for instance, is the share of the
          reference's claims that the other source covers.
        required: true
      metrics:
        range: RubricMetric
        multivalued: true
        inlined_as_list: true

  RubricMetric:
    description: >-
      One named, auditable judgement aggregated from an alignment's pairs. The
      standard names are relevance, informativeness, support, completeness and
      citation_quality, but the set is open.
    attributes:
      name:
        description: What the metric measures, for example completeness.
        required: true
      numerator:
        range: integer
        required: true
        description: How many of the counted items met the metric's condition.
      denominator:
        range: integer
        required: true
        description: >-
          How many items were counted. Zero means the metric did not apply (for
          example completeness when the reference has no claims); value is then null.
      value:
        range: float
        description: numerator / denominator, or null when denominator is zero.
      supporting_pair_ids:
        multivalued: true
        description: >-
          The pair ids this metric points to for audit: either the pairs behind
          the numerator or the shortfall behind it (for example the contradictory
          pairs), as the note says.
      supporting_claim_ids:
        multivalued: true
        description: >-
          The claim ids this metric points to for audit, for metrics counted over
          claims rather than pairs: either those behind the numerator or the
          shortfall (for example a source's uncovered or uncited claims), as the
          note says.
      note:
        description: A short human-readable gloss of what the metric counted.
