id: https://w3id.org/monarch/deep-research-client
name: deep-research-client
title: Deep Research Client Data Model
description: >-
  Controlled vocabularies describing what a deep research provider can *do*
  (capabilities), what data resources it *wraps* (resources), and where it sits
  on the spectrum from pure literature retrieval to autonomous "co-scientist"
  agents (archetype).

  This schema is the single source of truth for those enumerations. The Pydantic
  classes used at runtime are generated from it into
  ``deep_research_client/datamodel/deep_research_client_pydantic.py`` (see the
  ``gen-datamodel`` justfile target); do not edit the generated file by hand.
license: BSD-3-Clause
prefixes:
  linkml: https://w3id.org/linkml/
  drc: https://w3id.org/monarch/deep-research-client/
default_prefix: drc
default_range: string
imports:
  - linkml:types

enums:

  ProviderArchetype:
    description: >-
      Where a provider sits on the spectrum from pure retrieval to autonomous
      hypothesis-driven experimentation. The archetypes are ordered: each one is
      broadly a superset of the capabilities of the previous. A conventional
      "deep research" tool is a ``synthesizer``; it is a simple subset of what a
      ``co_scientist`` does (which additionally forms hypotheses, executes code,
      and designs experiments), sometimes traded off against more sophisticated
      literature-scanning algorithms.
    permissible_values:
      retriever:
        description: >-
          Returns retrieved evidence (papers, passages, snippets) without an
          authored synthesis step. Example: Asta.
        rank: 1
      synthesizer:
        description: >-
          Searches one or more corpora and writes a cited narrative report.
          This is the classic "deep research" archetype. Example: OpenAI Deep
          Research, Perplexity, Consensus, Edison/Falcon.
        rank: 2
      agentic_researcher:
        description: >-
          A multi-step agent that plans, browses, and may execute tools/code to
          assemble a report, but is still oriented around producing a written
          research answer. Example: Claude Code, Cyberian.
        rank: 3
      co_scientist:
        description: >-
          An autonomous scientific agent that forms and tests hypotheses,
          executes code against biomedical data, and can propose or design
          experiments. A superset of the ``synthesizer`` case. Example:
          OpenScientist, Biomni.
        rank: 4

  ResearchCapability:
    description: >-
      A functional capability a provider exposes: what kind of work it can
      perform. Values with legacy string identifiers are retained for backward
      compatibility with the earlier ``ModelCapability`` enumeration.
    permissible_values:
      web_search:
        description: Searches the open web for current information.
      academic_search:
        description: Searches curated academic / scholarly corpora.
      scientific_literature:
        description: Specialised search and analysis over scientific literature.
      citation_tracking:
        description: Produces and tracks structured citations/references.
      real_time_data:
        description: Can access recent / real-time information.
      code_interpretation:
        description: >-
          Executes code (data analysis, computation, plotting) as part of
          research. Formerly "runs code".
      visual_analysis:
        description: Interprets or generates figures, charts, and other visuals.
      multi_language:
        description: Operates across multiple natural languages.
      retrieval_only:
        description: >-
          Returns retrieved evidence verbatim without an authored synthesis
          step (pairs with the ``retriever`` archetype).
      evidence_synthesis:
        description: Synthesises multiple sources into an authored narrative report.
      hypothesis_generation:
        description: Proposes testable scientific hypotheses.
      experiment_design:
        description: Designs experiments or analysis plans to test hypotheses.
      data_analysis:
        description: >-
          Analyses structured biomedical or experimental datasets (beyond plain
          code execution), e.g. omics, sequences, or tabular study data.

  ResearchResource:
    description: >-
      A data source or knowledge base that a provider wraps or has direct access
      to. Distinct from capabilities: a capability is a verb (what it does), a
      resource is a noun (what it can reach).
    permissible_values:
      general_web:
        description: The open web.
      pubmed:
        description: PubMed / MEDLINE biomedical literature.
      semantic_scholar:
        description: Semantic Scholar scholarly corpus.
      arxiv:
        description: arXiv preprints.
      preprint_servers:
        description: Preprint servers such as bioRxiv / medRxiv.
      clinical_trials:
        description: Clinical trial registries (e.g. ClinicalTrials.gov).
      biomedical_databases:
        description: >-
          Curated biomedical knowledge bases and ontologies (e.g. disease,
          pathway, and drug databases).
      genomic_databases:
        description: Genome, gene, and variant databases (e.g. Ensembl, ClinVar).
      chemical_databases:
        description: Chemical and compound databases (e.g. PubChem, ChEMBL).
      protein_structure_databases:
        description: Protein and structure databases (e.g. UniProt, PDB).
