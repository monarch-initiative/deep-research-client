id: https://w3id.org/monarch-initiative/deep-research-client/reference-validation
name: reference_validation
title: Deep Research Client Reference Validation
description: >-
  Data model for the outcome of validating the references cited by a deep
  research report: whether each cited identifier resolves to a real record,
  whether quotes attributed to a reference actually appear in it, and whether a
  resolved reference looks like it is even about the report's subject.

  This schema is the source of truth for
  deep_research_client/validation/datamodel.py, which is generated from it with
  `just gen-datamodel`. Derived quantities (counts, rates) and markdown
  rendering are added in deep_research_client/validation/models.py; they are
  computed from these slots rather than stored.

license: BSD-3-Clause

prefixes:
  linkml: https://w3id.org/linkml/
  reference_validation: https://w3id.org/monarch-initiative/deep-research-client/reference-validation/

default_prefix: reference_validation
default_range: string

imports:
  - linkml:types

enums:

  ReferenceStatus:
    description: Outcome of resolving a single reference identifier.
    permissible_values:
      VERIFIED:
        description: The identifier resolves to a real record.
      NOT_FOUND:
        description: >-
          The identifier could not be resolved against any known source, so it
          is likely to have been confabulated.
      UNVERIFIABLE:
        description: >-
          The identifier was deliberately skipped, or no resolver exists for its
          prefix. Distinct from NOT_FOUND: nothing was learned either way.

  TopicalRelevance:
    description: >-
      How well a resolved reference's own metadata matches the vocabulary of the
      report citing it. This is a keyword overlap heuristic, not a judgement
      about whether the reference supports the claim made from it: a paper can
      be squarely on topic and still not say what the report says it says.
    permissible_values:
      ON_TOPIC:
        description: >-
          The reference's title and abstract share a substantial part of the
          report's distinctive vocabulary.
      UNCERTAIN:
        description: >-
          Some overlap, but not enough to call either way - or too little
          metadata to draw a conclusion from. The usual outcome for a record
          that resolved to a title and nothing else.
      OFF_TOPIC:
        description: >-
          An abstract's worth of text that shares almost none of the report's
          vocabulary. Worth a look: the identifier is real, so this is not a
          fabricated citation, but it may be an unrelated paper cited by mistake.
      NOT_ASSESSED:
        description: >-
          Relevance was not assessed, because the check was disabled, the
          reference did not resolve, or the report yielded no keywords.

classes:

  ReferenceCheck:
    description: Result of resolving one reference cited by a report.
    attributes:
      reference_id:
        description: Normalized identifier, for example PMID:7913883.
        required: true
      status:
        description: Resolution outcome.
        range: ReferenceStatus
        required: true
      occurrences:
        description: Number of times the identifier is mentioned in the report.
        range: integer
        required: true
        minimum_value: 1
        ifabsent: int(1)
      title:
        description: Title of the resolved record.
      year:
        description: Publication year of the resolved record.
      journal:
        description: Journal or venue of the resolved record.
      doi:
        description: DOI of the resolved record.
      content_type:
        description: >-
          Kind of content retrieved, for example abstract_only or full_text_xml.
      message:
        description: Explanation of the outcome, present when not verified.
      relevance:
        description: >-
          Whether the resolved record looks like it is about the same subject as
          the report citing it.
        range: TopicalRelevance
        required: true
        ifabsent: TopicalRelevance(NOT_ASSESSED)
      relevance_score:
        description: >-
          Share of the report's keyword weight that appears in this reference's
          own metadata, from 0 to 1. Zero when relevance was not assessed.
        range: float
        required: true
        minimum_value: 0.0
        maximum_value: 1.0
        ifabsent: float(0.0)
      matched_keywords:
        description: >-
          Report keywords found in this reference's metadata, most heavily
          weighted first. Recorded so a reader can see what the verdict rests on.
        multivalued: true

  SupportingTextCheck:
    description: >-
      Result of checking a quoted claim against the text of the reference it is
      attributed to.
    attributes:
      reference_id:
        description: Normalized identifier the quote is attributed to.
        required: true
      quote:
        description: Quoted text as it appears in the report.
        required: true
      was_checkable:
        description: >-
          Whether there was anything to check the quote against. False when the
          reference did not resolve, exposed no abstract or full text, was
          skipped by prefix, or fell outside a reference limit. A quote that was
          not checkable is not evidence of confabulation, so it is reported
          separately from one that was checked and not found.
        range: boolean
        required: true
        ifabsent: "True"
      is_valid:
        description: >-
          Whether the quote was found in the reference. Always false when
          was_checkable is false.
        range: boolean
        required: true
      similarity_score:
        description: >-
          Similarity of the closest match found, from 0 to 1. Clamped to that
          range, since it originates outside this codebase.
        range: float
        required: true
        minimum_value: 0.0
        maximum_value: 1.0
        ifabsent: float(0.0)
      matched_text:
        description: The matching span in the reference, when the quote was found.
      best_match:
        description: >-
          The closest non-matching span in the reference, when the quote was not
          found.
      suggested_fix:
        description: Suggested correction reported by the underlying validator.
      source_content_type:
        description: >-
          Kind of text the quote was searched in, for example abstract_only or
          full_text_xml. A failure against an abstract alone is much weaker
          evidence than one against retrieved full text, because the quote may
          simply come from a part of the paper that was never fetched.
      message:
        description: Validator explanation of the outcome.

  ReferenceValidationReport:
    description: Aggregate result of validating every reference cited by a report.
    attributes:
      references:
        description: Per-reference resolution results.
        range: ReferenceCheck
        multivalued: true
        inlined_as_list: true
      supporting_text:
        description: Per-quote supporting text results.
        range: SupportingTextCheck
        multivalued: true
        inlined_as_list: true
      report_keywords:
        description: >-
          The report's own distinctive terms, most heavily weighted first, as
          used to assess topical relevance. Empty when relevance was not
          assessed.
        multivalued: true
      validator_version:
        description: Version of linkml-reference-validator used to produce this report.
      truncated:
        description: >-
          Whether validation stopped early because a reference limit was
          reached, meaning the counts cover only part of the bibliography.
        range: boolean
        required: true
        ifabsent: "False"
