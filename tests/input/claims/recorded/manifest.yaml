# Model replies recorded for the claim-extraction prompt, replayed through the
# real parser by tests/test_claims_recorded.py.
#
# Recorded by running Claude subagents as the model: each saw only
# prompts/SYSTEM.txt and one prompts/NN-*.txt file, and wrote the reply the
# model should give. No other context. Re-record whenever the prompt or the
# units change; the test fails until you do.
#
# Prompt files are numbered across the sources in this order and named after
# the source ("03-report.txt" is the third unit, from marfan_report.md).
prompt_version: "3"
sources:
  - name: report
    file: marfan_report.md
  - name: notes
    file: generic_notes.yaml
  - name: provider
    file: lds_report.md
recordings:
  haiku: Claude Haiku (subagent)
  sonnet: Claude Sonnet (subagent)
